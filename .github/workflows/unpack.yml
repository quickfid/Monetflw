name: Распаковать zip в проект

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Очистить проект и распаковать новый
        run: |
          mkdir /tmp/new
          unzip -q FamilyBudget_v6.zip -d /tmp/new
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.github' /tmp/new/FamilyBudget/ ./

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Версия 5: новое приложение" || echo "Нечего коммитить"
          git push
