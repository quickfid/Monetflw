name: Распаковать ZIP в проект

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Проверить и распаковать архив
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="FamilyBudget_v6.zip"
          TMP="/tmp/new"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Архив $ARCHIVE не найден в корне репозитория"
            ls -la
            exit 1
          fi

          mkdir -p "$TMP"
          unzip -oq "$ARCHIVE" -d "$TMP"

          echo "Содержимое архива:"
          find "$TMP" -maxdepth 3 -type f | head -80

          PROJECT_FILE=$(find "$TMP" -name settings.gradle.kts -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Не найден settings.gradle.kts"
            exit 1
          fi

          SRC=$(dirname "$PROJECT_FILE")

          if [ ! -f "$SRC/app/build.gradle.kts" ]; then
            echo "::error::Не найден модуль app"
            exit 1
          fi

          echo "Найден проект: $SRC"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          rsync -a "$SRC/" ./ \
            --exclude='.git' \
            --exclude='.github'

      - name: Проверить проект
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Проект успешно распакован"

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Обновление FamilyBudget"
            git push
          fi
