name: Распаковать ZIP в проект

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'Имя ZIP-архива в корне репозитория (если пусто — найдётся автоматически)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  unpack_archive:
    name: Распаковка архива в репозиторий
    runs-on: ubuntu-latest

    steps:
      - name: 1. Получить репозиторий
        uses: actions/checkout@v4

      - name: 2. Найти и распаковать архив
        shell: bash
        env:
          INPUT_ARCHIVE: ${{ inputs.archive_name }}
        run: |
          set -euo pipefail

          ARCHIVE="${INPUT_ARCHIVE:-}"
          if [ -z "$ARCHIVE" ]; then
            ARCHIVE=$(find . -maxdepth 1 -name "*.zip" -type f -printf "%f\n" | sort | head -n 1)
          fi

          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "::error::ZIP-архив не найден в корне репозитория."
            ls -la
            exit 1
          fi

          echo "Используем архив: $ARCHIVE"
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT

          unzip -oq "$ARCHIVE" -d "$TMP"

          PROJECT_FILE=$(find "$TMP" -name "settings.gradle.kts" -type f | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::В архиве не найден файл settings.gradle.kts."
            find "$TMP" -maxdepth 3 -type f | head -n 80
            exit 1
          fi

          SRC=$(dirname "$PROJECT_FILE")
          if [ ! -f "$SRC/app/build.gradle.kts" ]; then
            echo "::error::В найденном проекте отсутствует app/build.gradle.kts."
            exit 1
          fi
          if [ ! -f "$SRC/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::В найденном проекте отсутствует app/src/main/AndroidManifest.xml."
            exit 1
          fi

          echo "Найден корень проекта: $SRC"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ARCHIVE" \
            -exec rm -rf {} +

          rsync -a "$SRC/" ./ \
            --exclude='.git' \
            --exclude='.github'

          rm -f "$ARCHIVE"

      - name: 3. Проверить структуру проекта
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "ru.familybudget.app"' app/build.gradle.kts
          echo "Проект успешно распакован и проверен."

      - name: 4. Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Изменений нет — пустой коммит не создаётся."
          else
            git commit -m "Обновление FamilyBudget из ZIP-архива"
            git push
          fi
