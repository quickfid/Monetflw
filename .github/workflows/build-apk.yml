name: Сборка подписанного Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки: release (подписанный) или debug (отладочный)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      version_code:
        description: 'Необязательный versionCode (по умолчанию номер запуска GitHub Actions)'
        required: false
        type: string
  push:
    branches:
      - main

jobs:
  build_release_apk:
    name: Сборка и подпись Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Получение исходников
        uses: actions/checkout@v4

      - name: 2. Проверка структуры проекта и AndroidManifest
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "ru.familybudget.app"' app/build.gradle.kts
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          echo "Структура проекта и AndroidManifest корректны."

      - name: 3. Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Настройка Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 5. Проверка Gradle
        run: gradle --version

      - name: 6. Подготовка постоянного ключа подписи из GitHub Secrets
        if: ${{ inputs.build_type != 'debug' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Не заданы обязательные GitHub Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            echo "Добавьте постоянный keystore в Settings -> Secrets and variables -> Actions или выберите build_type=debug при ручном запуске."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/familybudget-release.keystore
          test -s /tmp/familybudget-release.keystore
          echo "KEYSTORE_FILE=/tmp/familybudget-release.keystore" >> "$GITHUB_ENV"

      - name: 7. Проверка Kotlin-компиляции
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            gradle compileDebugKotlin --stacktrace
          else
            gradle compileReleaseKotlin --stacktrace
          fi

      - name: 8. Сборка APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            gradle assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: 9. Проверка подписи APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
            ARTIFACT_NAME="FamilyBudget-Debug-APK"
          else
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
            ARTIFACT_NAME="FamilyBudget-Release-APK"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK не найден."
            exit 1
          fi
          echo "Найден APK: $APK_PATH"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner не найден в Android SDK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: 10. Сохранение APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Очистка временного ключа
        if: always()
        shell: bash
        run: rm -f /tmp/familybudget-release.keystore
