name: Сборка подписанного Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки: auto (release при наличии секретов, иначе debug), release или debug'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - release
          - debug
      version_code:
        description: 'Необязательный versionCode (по умолчанию номер запуска GitHub Actions)'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Сборка и подпись Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Получение исходников
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 2. Проверка структуры проекта и AndroidManifest
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "ru.familybudget.app"' app/build.gradle.kts
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          echo "Структура проекта и AndroidManifest корректны."

      - name: 3. Настройка Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Настройка Gradle 8.14.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.8'

      - name: 5. Проверка Gradle
        run: gradle --version

      - name: 5.5. Кэш постоянного debug-ключа (чтобы Debug APK ставился поверх предыдущего)
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: familybudget-debug-keystore-v1

      - name: 6. Определение типа сборки и подготовка ключа подписи
        shell: bash
        env:
          REQUESTED_TYPE: ${{ inputs.build_type || 'auto' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          HAS_SECRETS=false
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            HAS_SECRETS=true
          fi

          if [ "$REQUESTED_TYPE" = "debug" ]; then
            ACTUAL_TYPE="debug"
          elif [ "$REQUESTED_TYPE" = "release" ]; then
            if [ "$HAS_SECRETS" != "true" ]; then
              echo "::error::Запрошена сборка release, но не заданы GitHub Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
              exit 1
            fi
            ACTUAL_TYPE="release"
          else
            if [ "$HAS_SECRETS" = "true" ]; then
              ACTUAL_TYPE="release"
            else
              echo "::notice::Секреты подписи ещё не настроены — собираем отладочный Debug APK. После добавления 4 секретов сборка автоматически переключится на подписанный Release APK."
              ACTUAL_TYPE="debug"
            fi
          fi

          echo "ACTUAL_TYPE=$ACTUAL_TYPE" >> "$GITHUB_ENV"
          echo "Выбран режим сборки: $ACTUAL_TYPE"

          if [ "$ACTUAL_TYPE" = "release" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/familybudget-release.keystore
            test -s /tmp/familybudget-release.keystore
            echo "KEYSTORE_FILE=/tmp/familybudget-release.keystore" >> "$GITHUB_ENV"

            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              RELEASE_TAG="${GITHUB_REF_NAME}"
              VERSION_NAME="${RELEASE_TAG#v}"
            else
              LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
              if [ -n "$LAST_TAG" ]; then
                VER="${LAST_TAG#v}"
                MAJOR=$(echo "$VER" | cut -d. -f1)
                MINOR=$(echo "$VER" | cut -d. -f2)
                PATCH=$(echo "$VER" | cut -d. -f3)
                VERSION_NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
              else
                VERSION_NAME="1.4.1"
              fi
              RELEASE_TAG="v${VERSION_NAME}"
            fi
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
            echo "Версия релиза: $RELEASE_TAG"
          fi

      - name: 7. Проверка Kotlin-компиляции и unit-тестов
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          gradle testDebugUnitTest --stacktrace
          if [ "$ACTUAL_TYPE" = "debug" ]; then
            gradle compileDebugKotlin --stacktrace
          else
            gradle compileReleaseKotlin --stacktrace
          fi

      - name: 8. Сборка APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          if [ "$ACTUAL_TYPE" = "debug" ]; then
            gradle assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: 9. Проверка подписи APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ACTUAL_TYPE" = "debug" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
            ARTIFACT_NAME="FamilyBudget-Debug-APK"
          else
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
            ARTIFACT_NAME="FamilyBudget-Release-APK"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK не найден."
            exit 1
          fi
          echo "Найден APK: $APK_PATH"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner не найден в Android SDK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: 10. Сохранение APK в Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: 11. Автоматическая публикация в GitHub Releases (при теге v* или ручном запуске)
        if: env.ACTUAL_TYPE == 'release' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          RELEASE_APK="FamilyBudget-${TAG}-release.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" \
              --title "FamilyBudget ${TAG}" \
              --generate-notes
          fi

      - name: Очистка временного ключа
        if: always()
        shell: bash
        run: rm -f /tmp/familybudget-release.keystore
