name: Создать ключ подписи (1 раз)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Придумайте пароль для ключа (минимум 6 символов, запомните его!)'
        required: true
        type: string
      key_alias:
        description: 'Имя ключа (оставьте familybudget)'
        required: true
        default: 'familybudget'
        type: string

jobs:
  generate_keystore:
    name: Одноразовая генерация release keystore
    runs-on: ubuntu-latest

    steps:
      - name: 1. Настройка Java 17 (keytool)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 2. Генерация постоянного ключа подписи и Base64
        shell: bash
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KS_ALIAS: ${{ inputs.key_alias }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KS_PASS"
          if [ "${#KS_PASS}" -lt 6 ]; then
            echo "::error::Пароль должен быть не короче 6 символов."
            exit 1
          fi

          mkdir -p /tmp/ks-out
          keytool -genkeypair -v \
            -keystore /tmp/ks-out/familybudget-release.keystore \
            -alias "$KS_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=FamilyBudget, OU=Mobile, O=FamilyBudget, L=Moscow, ST=Moscow, C=RU" \
            >/dev/null 2>&1

          base64 -w 0 /tmp/ks-out/familybudget-release.keystore > /tmp/ks-out/keystore.b64
          test -s /tmp/ks-out/familybudget-release.keystore
          test -s /tmp/ks-out/keystore.b64
          echo "Ключ и Base64 успешно созданы. Скачайте артефакт и добавьте 4 секрета в Settings → Secrets → Actions."

      - name: 3. Сохранение в Artifacts (автоудаление через 1 день)
        uses: actions/upload-artifact@v7
        with:
          name: familybudget-release-keystore
          path: /tmp/ks-out/
          retention-days: 1
          if-no-files-found: error

      - name: 4. Очистка временных файлов
        if: always()
        shell: bash
        run: rm -rf /tmp/ks-out
