name: 1. Создать ключ подписи (один раз)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Сгенерировать ключ
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore upload.jks -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Family Budget, O=Family Budget, C=RU"
          base64 -w0 upload.jks > KEYSTORE_BASE64.txt
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=upload"
          } > PASSWORDS.txt
      - name: Сохранить ключ как артефакт (хранить в тайне!)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-СОХРАНИТЕ-И-УДАЛИТЕ
          path: |
            upload.jks
            KEYSTORE_BASE64.txt
            PASSWORDS.txt
          retention-days: 1
